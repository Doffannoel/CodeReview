services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codereviewer
      POSTGRES_USER: codereviewer
      POSTGRES_PASSWORD: codereviewer
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codereviewer"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/codereviewer-password
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p codereviewer-password 'RETURN 1' >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
    volumes:
      - neo4j-data:/data

  api:
    build:
      context: ../..
    env_file:
      - path: ../../.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://codereviewer:codereviewer@postgres:5432/codereviewer}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-codereviewer-password}
    command: uvicorn codereviewer.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  worker:
    build:
      context: ../..
    env_file:
      - path: ../../.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://codereviewer:codereviewer@postgres:5432/codereviewer}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-codereviewer-password}
    command: python -m codereviewer.worker
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

volumes:
  postgres-data:
  neo4j-data:

