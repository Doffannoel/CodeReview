name: graphmethod-srs-test
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: srs_test
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: srs_test
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srs_test"]
      interval: 2s
      timeout: 2s
      retries: 30
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/local-test-only
      NEO4J_server_memory_heap_initial__size: 128m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 128m
    ports:
      - "127.0.0.1:17687:7687"
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "local-test-only", "RETURN 1"]
      interval: 5s
      timeout: 5s
      retries: 30
