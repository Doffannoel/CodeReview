[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphmethod-code-reviewer"
version = "0.1.0"
description = "GitHub App code reviewer using pull request diffs and Neo4j graph retrieval"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "neo4j>=5.28,<7",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pyjwt[crypto]>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
code-reviewer-api = "codereviewer.main:run"
code-reviewer-worker = "codereviewer.worker:run"

[tool.hatch.build.targets.wheel]
packages = ["src/codereviewer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
